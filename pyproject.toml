[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-swing-predictor"
version = "0.1.0"
description = "Low-frequency Bitcoin swing trading decision-support system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["btc_predictor*"]

[tool.setuptools.package-data]
btc_predictor = [
    "config/environments/*.toml",
    "config/strategy/*.toml",
    "db/migrations/*.mako",
    "db/migrations/*.md",
]

[tool.pytest.ini_options]
testpaths = ["btc_predictor/tests"]
pythonpath = ["."]
addopts = "-ra"
