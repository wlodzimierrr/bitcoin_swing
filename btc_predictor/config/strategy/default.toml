[identity]
config_version = "strategy_config_v1"
strategy_version = "swing_v1.0"
parameter_set_id = "default_phase1"

[entry_thresholds]
ignore_below = 70
watch_min = 70
valid_trade_min = 80
strong_setup_min = 85
exceptional_min = 90
short_valid_trade_min = 85

[hold_thresholds]
possible_add_min = 85
hold_min = 70
no_add_min = 60
defensive_min = 50
trim_min = 40
exit_below = 40

[add_thresholds]
add_min = 85
existing_position_must_be_profitable = true
stop_must_improve = true
no_average_down = true

[risk]
max_risk_at_stop_fraction_nav = 0.01

[[risk.schedule]]
min_entry_conviction = 80
max_entry_conviction = 85
risk_fraction_nav = 0.0035

[[risk.schedule]]
min_entry_conviction = 85
max_entry_conviction = 90
risk_fraction_nav = 0.005

[[risk.schedule]]
min_entry_conviction = 90
risk_fraction_nav = 0.006

[stop_buffers]
atr_period = 20
atr_multiplier = 0.3
minimum_level_noise_multiplier = 1.0
sweep_atr_multipliers = [0.25, 0.3, 0.5, 0.75]

[setup_requirements]
supported_setups = ["bull_trend_continuation", "bullish_reset"]

[setup_requirements.bull_trend_continuation]
regime_min = 65
trend_min = 70
flow_min = 55
positioning_min = 60
structure_min = 70
minimum_rr = 2.0
entry_conviction_min = 80
require_no_stress = true
require_no_severe_crowding = true

[setup_requirements.bullish_reset]
regime_min = 55
trend_min = 55
correction_min_fraction = 0.08
correction_max_fraction = 0.25
funding_health_improving_days = 7
oi_health_stable_days = 7
flow_accel_improving_days = 5
structure_min = 70
entry_trigger_required = true
entry_conviction_min = 80
minimum_rr = 2.0

[regime_thresholds]
strong_bull_min = 80
bull_min = 65
mild_bull_min = 55
neutral_min = 45
mild_bear_min = 35
bear_min = 20

[price_levels]
swing_window_weeks = 3
swing_window_months = 2
cluster_distance_fraction = 0.025
minimum_level_strength = 60
breakout_close_buffer_fraction = 0
reclaim_close_buffer_fraction = 0
anchored_vwap_price_source = "hlc3"
volume_profile_price_source = "hlc3"
volume_profile_bin_size_fraction = 0.01
volume_profile_value_area_fraction = 0.70
volume_profile_hvn_volume_fraction = 0.70
volume_profile_min_bars = 20
level_strength_touch_count_full = 4
level_strength_reaction_full_fraction = 0.10
entry_location_full_score_distance_fraction = 0.01
entry_location_zero_score_distance_fraction = 0.08
rr_minimum = 2.0
rr_preferred_min = 2.5
rr_preferred_max = 3.0
reward_reference_order = [
    "nearest_major_weekly_monthly_resistance_cluster",
    "prior_local_swing_high",
    "prior_range_high",
    "conservative_setup_measured_move",
]

[price_levels.level_strength_weights]
timeframe = 0.20
touch_count = 0.20
reaction_magnitude = 0.20
volume = 0.20
confluence = 0.20

[price_levels.level_strength_timeframe_scores]
"1h" = 40
"1d" = 65
"1w" = 85
"1mo" = 100
unknown = 50

[scoring_weights.entry_conviction]
trend = 0.20
regime = 0.20
flow = 0.20
positioning = 0.15
volatility = 0.10
structure = 0.15

[scoring_weights.hold_score]
regime = 0.25
trend = 0.20
flow = 0.20
positioning = 0.15
structure = 0.10
momentum_persistence = 0.10

[scoring_weights.add_score]
hold_score = 0.20
new_structure = 0.25
flow = 0.20
positioning = 0.15
momentum = 0.10
risk_improvement = 0.10

[scoring_weights.full_flow]
etf_norm_5 = 0.30
etf_norm_20 = 0.25
flow_accel = 0.20
cvd_spread = 0.15
spot_dominance = 0.10

[scoring_weights.core_flow]
etf_norm_5 = 0.40
etf_norm_20 = 0.35
flow_accel = 0.25

[scoring_weights.core_regime]
trend = 0.45
flow = 0.25
volatility = 0.15
positioning = 0.15

[scoring_weights.full_regime]
trend = 0.35
flow = 0.20
macro = 0.15
onchain = 0.10
volatility = 0.10
liquidity = 0.10

[scoring_weights.positioning]
funding_health = 0.35
oi_health = 0.30
basis_health = 0.20
leverage_health = 0.15

[scoring_weights.structure_score]
level_strength = 0.45
entry_location = 0.25
rr_quality = 0.20
confluence = 0.10

[positioning_flags.crowding]
funding_zscore_min = 2.0
basis_zscore_min = 2.0
oi_intensity_percentile_min = 90
entry_quality_penalty = 10

[volatility_flags.stress]
volatility_percentile_min = 95
liquidation_percentile_min = 95
downside_return_min = -0.10
funding_abs_zscore_min = 3.0
basis_abs_zscore_min = 3.0
max_exposure_multiplier = 0.50
block_new_trades = false

[backtest]
initial_cash = 100000
fee_bps = 10
slippage_bps = 5
funding_cost_bps_per_day = 0
max_trades_per_year = 24
allow_short_trades = false
execution_timing = "next_bar"
